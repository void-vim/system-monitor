name: deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/sys-monitor:latest

      - name: Deploy to remote server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "[INFO] Pulling latest container image"
            docker pull ${{ secrets.DOCKER_USERNAME }}/sys-monitor:latest
            echo "[INFO] Stopping existing container"
            docker stop sys-monitor || true
            docker rm sys-monitor || true
            echo "[INFO] Starting new container instance"
            docker run -d --name sys-monitor -p 8080:8080 --restart always ${{ secrets.DOCKER_USERNAME }}/sys-monitor:latest
